#configuration du serveur Nginx

# NIVEAU 1 : Configuration générale

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
	worker_connections 1024;
}

#NIVEAU 2 : Section HTTP (pour le web)

http{
	#NIVEAU 3 : Upstream (pour envoyer les requetes)
	upstream wordpress{
	server wordpress:9000; 
	}

	#NIVEAU 4 : Server (comment ecouter)
       server
	   {
       		listen 443 ssl http2;
       		server_name aait-laf.42.fr;
			
			#Ou sont fichier du site, Nginx ne sait pas où chercher les fichiers
			#/var/www/html folser ou Worpress est installe
			root /var/www/html;
			index index.php index.html;
			
			#SSL
			ssl_certificate /etc/nginx/ssl/inception.crt;
			ssl_certificate_key /etc/nginx/ssl/inception.key;
			ssl_protocols TLSv1.2 TLSv1.3;
		location ~ \.php$
			{
			include fastcgi_params;	
			fastcgi_pass wordpress;
			fastcgi_index index.php;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			}
		location / 
			{
			try_files $uri $uri/ /index.php?$args;
			}
		location ~ /\. 
			{
			deny all;
			}
       }	
}

